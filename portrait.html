<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портрет — тест перемикача</title>
<style>
  :root { --bg:#f4f4f2; --text:#17171a; --muted:#77777e; --line:#e3e3e0; --panel:#fff; }
  html[data-theme="dark"] { --bg:#0b0b0c; --text:#ededee; --muted:#8a8a90; --line:#232326; --panel:#141416; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    transition: background .35s ease, color .35s ease;
  }
  .demo { display:flex; flex-direction:column; align-items:flex-start; gap:26px; }
  .portrait {
    position:relative; width:220px; height:220px;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 38%, rgba(0,0,0,.62) 58%, rgba(0,0,0,.22) 73%, transparent 86%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 38%, rgba(0,0,0,.62) 58%, rgba(0,0,0,.22) 73%, transparent 86%);
  }
  .portrait img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; opacity:0; pointer-events:none;
  }
  .portrait img.on { opacity:1; }
  .name { color:var(--muted); font-size:15px; }
  h1 { font-size:20px; font-weight:400; line-height:1.45; max-width:340px; }
  .toggle {
    width:42px; height:42px; border-radius:12px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--text); cursor:pointer; font-size:15px;
  }
  .hint { color:var(--muted); font-size:13px; }
  .toggle svg { display: block; }
  html[data-theme="light"] .i-moon { display: none; }
  html[data-theme="dark"]  .i-sun  { display: none; }
</style>
</head>
<body>

<div class="demo">
  <div class="portrait" id="portrait"></div>
  <div class="name">Іван Мандровний</div>
  <h1>Придумую рекламу українським брендам. Здебільшого без запиту з їхнього боку.</h1>
  <button class="toggle" id="themeBtn" aria-label="Тема"><svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg><svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg></button>
  <div class="hint">тимчасова сторінка для перевірки анімації</div>
</div>

<script>
const FRAME_COUNT = 38;
const DURATION    = 900;   // мс на повний хід
const PATH = i => `frames/hat_${String(i).padStart(3,'0')}.webp`;

const box = document.getElementById('portrait');
const imgs = [];
for (let i = 1; i <= FRAME_COUNT; i++) {
  const im = new Image();
  im.src = PATH(i);
  im.alt = '';
  if (i === 1) im.className = 'on';
  box.appendChild(im);
  imgs.push(im);
}

let current = 0;          // 0 = у кепці й окулярах (світла тема)
let target  = 0;
let raf = null;
let last = null;

function show(idx) {
  const i = Math.round(idx);
  imgs.forEach((im, k) => im.classList.toggle('on', k === i));
}

function tick(ts) {
  if (last === null) last = ts;
  const dt = ts - last;
  last = ts;
  const step = (FRAME_COUNT - 1) * (dt / DURATION);
  if (current < target) current = Math.min(target, current + step);
  else if (current > target) current = Math.max(target, current - step);
  show(current);
  if (current !== target) raf = requestAnimationFrame(tick);
  else { raf = null; last = null; }
}

function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  target = dark ? FRAME_COUNT - 1 : 0;
  if (!raf) { last = null; raf = requestAnimationFrame(tick); }
}

document.getElementById('themeBtn').addEventListener('click', () => {
  setTheme(document.documentElement.dataset.theme !== 'dark');
});
</script>
</body>
</html>
