<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блог — Іван Мандровний</title>
<meta name="description" content="Тексти про рекламу й копірайт. Частина безкоштовна, частина — ні.">
<script>
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/folders.css">
<script src="/posts.js"></script>
<!-- не малювати сторінку (і кадр переходу), поки не заповнено лічильник і статті -->
<link rel="expect" href="#rendered" blocking="render">
</head>
<body>

<div class="desk">

  <nav class="tabs" role="tablist" aria-label="Розділи сайту">
    <a class="tab" role="tab" href="/" aria-selected="false" tabindex="-1">Портфоліо <span class="mono">8</span></a>
    <a class="tab" role="tab" href="/blog" aria-selected="true" aria-controls="blog">Блог <span class="mono" id="blogCount">1</span></a>
  </nav>
  <script>document.getElementById('blogCount').textContent = window.visiblePosts().length;</script>

  <div class="stack">

    <!-- БЛОГ -->
    <main class="sheet front" id="blog" data-folder="blog" role="tabpanel" aria-label="Блог">
      <div class="mast">
        <div>
          <h1>Блог</h1>
          <p class="lede">Тексти про рекламу й копірайт. Частина безкоштовна, частина — ні.</p>
          <div class="author"><span class="av"><img src="/frames/hat_001.webp" alt=""></span><span>Пише Іван Мандровний</span></div>
        </div>
        <div class="mast-r">
          <div class="mast-top">
            <span class="mono" id="range">№ 001</span>
            <button class="toggle" type="button" title="Тема" aria-label="Тема"><svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg><svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg></button>
          </div>
          <a class="btn2" href="#">Telegram-канал <span aria-hidden="true">↗</span></a>
        </div>
      </div>

      <div class="filters" role="group" aria-label="Тип статті" hidden></div>

      <!-- Статті малюються з posts.js -->
      <div class="posts" id="posts">
        <a class="post feature" href="/blog-10-priyomiv">
          <div class="cover cover-type"><span class="big" aria-hidden="true">10</span></div>
          <div class="meta-col">
            <div class="post-meta"><span class="badge">Безкоштовно</span><span class="mono">№ 001</span><span class="mono">22.08.2026</span></div>
            <div class="post-title">10 пробивних текстових прийомів, після яких читач стає покупцем</div>
          </div>
        </a>
      </div>
    </main>

    <!-- ПОРТФОЛІО — задня папка, вміст на / -->
    <div class="sheet back" data-folder="portfolio" aria-hidden="true"></div>

  </div>
</div>

<script>
  (function () {
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var posts = window.visiblePosts();

    function cover(c) {
      if (c.brand) return '<div class="cover cover-brand" style="background:' + esc(c.bg) + '"><span class="b">' + esc(c.brand) + '</span></div>';
      if (c.big) return '<div class="cover cover-type"><span class="big" aria-hidden="true">' + esc(c.big) + '</span></div>';
      return '<div class="cover cover-type"><span class="word" aria-hidden="true">' + esc(c.word) + '</span></div>';
    }
    function meta(p, feature) {
      var m = p.free ? '<span class="badge">Безкоштовно</span>' : '';
      m += '<span class="mono">' + window.postNo(p.n) + '</span>';
      /* у найновішій статті й опублікованих — дата; у чернетках дати ще немає — тип */
      m += '<span class="mono">' + esc(p.date || window.POST_TYPES[p.type][0]) + '</span>';
      if (p.draft) m += '<span class="draft-mark">чернетка</span>';
      return '<div class="post-meta">' + m + '</div>';
    }
    function card(p, i) {
      var title = '<div class="post-title">' + esc(p.title) + '</div>';
      var attrs = ' href="' + esc(window.postUrl(p)) + '" data-type="' + p.type + '"';
      if (i === 0) return '<a class="post feature"' + attrs + '>' + cover(p.cover) + '<div class="meta-col">' + meta(p) + title + '</div></a>';
      return '<a class="post"' + attrs + '>' + cover(p.cover) + meta(p) + title + '</a>';
    }

    document.getElementById('posts').innerHTML = posts.map(card).join('');

    /* діапазон номерів: «№ 001» або «№ 001 — № 00N» */
    var nums = posts.map(function (p) { return p.n; });
    var lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
    document.getElementById('range').textContent = lo === hi ? window.postNo(lo) : window.postNo(lo) + ' — ' + window.postNo(hi);

    /* фільтр: тільки якщо типів статей хоча б два */
    var counts = {};
    posts.forEach(function (p) { counts[p.type] = (counts[p.type] || 0) + 1; });
    var types = Object.keys(window.POST_TYPES).filter(function (t) { return counts[t]; });
    if (types.length < 2) return;
    var bar = document.querySelector('.filters');
    var chip = function (key, label, n) {
      return '<button class="chip" type="button" aria-pressed="' + (key === 'all') + '" data-f="' + key + '">' + label + ' <span class="mono">' + n + '</span></button>';
    };
    bar.innerHTML = chip('all', 'Усі', posts.length) + types.map(function (t) { return chip(t, window.POST_TYPES[t][1], counts[t]); }).join('');
    bar.hidden = false;
    var cards = Array.prototype.slice.call(document.querySelectorAll('#posts .post'));
    bar.addEventListener('click', function (e) {
      var c = e.target.closest('.chip');
      if (!c) return;
      bar.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', x === c); });
      cards.forEach(function (p) { p.hidden = !(c.dataset.f === 'all' || p.dataset.type === c.dataset.f); });
    });
  })();
</script>
<span id="rendered" hidden></span>
<script src="/folders.js"></script>
</body>
</html>
